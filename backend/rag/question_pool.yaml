# Пул вопросов для проверки (оценочный, не строгий регресс).
# Импорт: import_golden_to_langfuse.py --source backend/rag/question_pool.yaml
#         --dataset question-pool
# Прогон: run_regression.py --dataset question-pool --yaml backend/rag/question_pool.yaml
# Оценка пула — глазами в UI + Слой 1 + судья: contains/excludes здесь только
# там, где факт стабилен. expect_silence: true — правильный ответ «тишина».
- id: pool_commanders_full
  question: "Кто входит в командный состав штаба «Тесла»?"
  expect_intent: commanders
  contains: ["Астафьев", "Шарифуллин"]
  excludes: []
  notes: "Ядро: 8 человек, иерархия командир→комиссар→мастера→пресса"
